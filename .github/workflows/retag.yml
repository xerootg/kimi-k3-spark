name: retag

# Point a floating tag (for example :stable) at an image already in ghcr by
# digest, without rebuilding. Used to snapshot a measured production baseline.

on:
  workflow_dispatch:
    inputs:
      image:
        description: image name under ghcr.io/xerootg
        required: true
        default: llamacpp-spark
      digest:
        description: sha256:... of the manifest (index) to tag
        required: true
      tag:
        description: tag to create or move
        required: true
        default: stable

permissions:
  contents: read
  packages: write

jobs:
  retag:
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: retag by digest
        run: |
          set -eu
          src="ghcr.io/xerootg/${{ inputs.image }}@${{ inputs.digest }}"
          dst="ghcr.io/xerootg/${{ inputs.image }}:${{ inputs.tag }}"
          docker buildx imagetools create -t "$dst" "$src"
          docker buildx imagetools inspect "$dst" | head -5

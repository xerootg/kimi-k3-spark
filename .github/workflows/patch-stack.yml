name: patch stack

on:
  push:
    paths:
      - "patches/**"
      - "versions.env"
      - "tools/patch-stack-check.sh"
      - ".github/workflows/patch-stack.yml"
  pull_request:
    paths:
      - "patches/**"
      - "versions.env"
      - "tools/patch-stack-check.sh"
      - ".github/workflows/patch-stack.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: Install host header dependency
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends liburing-dev
      - name: Fetch pinned upstream commit
        shell: bash
        run: |
          sha=$(sed -n 's/^LLAMA_SHA=//p' versions.env)
          [[ $sha =~ ^[0-9a-f]{40}$ ]]
          git init -q "$RUNNER_TEMP/llama.cpp"
          git -C "$RUNNER_TEMP/llama.cpp" remote add origin https://github.com/ggml-org/llama.cpp.git
          git -C "$RUNNER_TEMP/llama.cpp" fetch --depth=1 origin "$sha"
          git -C "$RUNNER_TEMP/llama.cpp" checkout -q --detach FETCH_HEAD
      - name: Apply stack and check host C++ syntax
        run: tools/patch-stack-check.sh "$RUNNER_TEMP/llama.cpp"

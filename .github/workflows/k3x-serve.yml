name: k3x-serve

# Separate from images.yml so a change to the SYCL expert server does not
# rebuild the Spark images (and the reverse).
on:
  push:
    branches: [main]
    paths:
      - "tools/bitexact/sycl/**"
      - "tools/bitexact/cpu/k3cpu.h"
      - "tools/bitexact/cpu/k3cpu.cpp"
      - "tools/bitexact/cpu/k3cs.cpp"
      - "tools/bitexact/cpu/build_k3cs.sh"
      - "tools/bitexact/expert_disk.h"
      - "tools/bitexact/mufu/mufu_emu.h"
      - "tools/glm53/**"
      - "versions.env"
      - "docker/k3x-serve.Dockerfile"
      - ".github/workflows/k3x-serve.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  k3x-serve:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          set -a; . ./versions.env; set +a
          echo "llama_sha=$LLAMA_SHA" >> "$GITHUB_OUTPUT"
          echo "build=g${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
      - name: free disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/k3x-serve.Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          build-args: |
            LLAMA_SHA=${{ steps.v.outputs.llama_sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: |
            ghcr.io/xerootg/k3x-serve:${{ steps.v.outputs.build }}
            ghcr.io/xerootg/k3x-serve:latest
      - name: GLM binaries smoke (no GPU or tables)
        run: |
          set -euo pipefail
          image=ghcr.io/xerootg/k3x-serve:${{ steps.v.outputs.build }}
          docker run --rm --network none --entrypoint /opt/k3x/g53cs "$image" --help
          docker run --rm --network none --entrypoint /opt/k3x/g53x "$image" --help
      - name: publish tested image
        run: |
          set -euo pipefail
          docker push ghcr.io/xerootg/k3x-serve:${{ steps.v.outputs.build }}
          docker push ghcr.io/xerootg/k3x-serve:latest

name: repack-experts tests

on:
  pull_request:
    paths:
      - "tools/**"
      - ".github/workflows/repack-experts-tests.yml"

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python3 -m unittest discover -s tools/tests -v

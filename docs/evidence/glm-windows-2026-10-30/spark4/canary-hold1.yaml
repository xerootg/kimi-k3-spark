apiVersion: apps/v1
kind: Deployment
metadata:
  name: glm53-spark-canary
  namespace: kimi-k3
  labels:
    app.kubernetes.io/name: glm53-spark-canary
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: glm53-spark-canary
  template:
    metadata:
      labels:
        app.kubernetes.io/name: glm53-spark-canary
    spec:
      runtimeClassName: nvidia
      nodeSelector:
        kubernetes.io/hostname: spark-3acd
      tolerations:
      - key: nvidia.com/gpu
        operator: Equal
        value: present
        effect: NoSchedule
      terminationGracePeriodSeconds: 300
      containers:
      - name: llama-server
        image: ghcr.io/xerootg/llamacpp-spark:547208dca250-ga5fa848
        imagePullPolicy: IfNotPresent
        securityContext:
          capabilities:
            add:
            - IPC_LOCK
        lifecycle:
          preStop:
            exec:
              command:
              - /bin/sh
              - -c
              - kill -INT 1; while kill -0 1 2>/dev/null; do sleep 1; done
        args:
        - -m
        - /models/GLM-5.3-Flash-UD-Q2_K_XL-00001-of-00004.gguf
        - --alias
        - glm-5.3-flash
        - --host
        - 0.0.0.0
        - --port
        - '8080'
        - --ctx-size
        - '1048576'
        - --parallel
        - '4'
        - --batch-size
        - '2048'
        - --ubatch-size
        - '2048'
        - --n-gpu-layers
        - '999'
        - --n-cpu-moe
        - '999'
        - --moe-cache-mib
        - '78000'
        - --cache-ram
        - '0'
        - --threads
        - '8'
        - --threads-batch
        - '20'
        - --flash-attn
        - 'on'
        - --jinja
        - --metrics
        - --no-warmup
        - --fit
        - 'off'
        - --load-mode
        - mmap
        - -lv
        - '4'
        env:
        - name: LLAMA_LOG_COLORS
          value: '0'
        - name: LLAMA_EXPERT_STORE
          value: /store/glm53flash-q2.k3xs
        - name: LLAMA_EXPERT_STORE_SNAPSHOT
          value: /snapshot/glm53flash-q2.k3sn
        - name: LLAMA_EXPERT_STORE_THREADS
          value: '16'
        - name: LLAMA_API_KEY
          valueFrom:
            secretKeyRef:
              name: kimi-api-key
              key: LLAMA_API_KEY
        - name: LLAMA_EXPERT_STORE_SELF_PREFETCH
          value: '1'
        - name: LLAMA_EXPERT_STORE_SPLIT
          value: '1'
        - name: LLAMA_EXPERT_STORE_SECOND_CHANCE
          value: '3'
        - name: LLAMA_EXPERT_STORE_RESERVE_MIB
          value: '6144'
        - name: LLAMA_ELASTIC_KV
          value: '1'
        - name: LLAMA_ELASTIC_KV_REFUSE
          value: '1'
        - name: LLAMA_EXPERT_STORE_BYTE_STRIDE
          value: '1'
        - name: LLAMA_EXPERT_STORE_PREFETCH
          value: '0'
        - name: LLAMA_EXPERT_STORE_PREFETCH_INPUT
          value: '3'
        - name: LLAMA_EXPERT_STORE_SPLIT_LATE
          value: '1'
        - name: LLAMA_EXPERT_STORE_SPLIT_SKIP_ZERO
          value: '1'
        - name: LLAMA_EXPERT_STORE_HOOK_LEAN
          value: '1'
        - name: LLAMA_EXPERT_STORE_POLICY
          value: lfu
        - name: LLAMA_EXPERT_STORE_LFU_HALF_LIFE
          value: '262144'
        - name: LLAMA_EXPERT_STORE_PREFILL_BANK
          value: '1'
        - name: LLAMA_EXPERT_STORE_THP_BANK
          value: '1'
        - name: GGML_CUDA_Q8_REUSE
          value: '1'
        - name: GGML_CUDA_FUSE_HC
          value: '1'
        - name: GGML_CUDA_FUSE_GDN_STATE
          value: '1'
        - name: GGML_CUDA_FUSE_KDA
          value: '1'
        - name: GGML_CUDA_FUSE_CONV_STATE
          value: '1'
        - name: GGML_CUDA_BATCH_INVARIANT
          value: '1'
        - name: GGML_CUDA_BI_ATTN_CHUNK
          value: '128'
        - name: GGML_CUDA_BI_FUSE
          value: '1'
        - name: LLAMA_KV_STREAM_HOLES
          value: '1'
        - name: LLAMA_PREFILL_ISOLATE
          value: '1'
        - name: LLAMA_CLIENT_CLASSES
          value: /client-classes/classes.txt
        - name: LLAMA_SLOT_RESERVE
          value: '1'
        - name: LLAMA_PRIORITY_HOLD_PROMPTS
          value: '1'
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        startupProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 30
          failureThreshold: 120
        readinessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 15
        resources:
          requests:
            cpu: '12'
            memory: 48Gi
            nvidia.com/gpu: '1'
          limits:
            nvidia.com/gpu: '1'
        volumeMounts:
        - name: models
          mountPath: /models
          readOnly: true
        - name: store
          mountPath: /store
          readOnly: true
        - name: snapshot
          mountPath: /snapshot
        - name: client-classes
          mountPath: /client-classes
          readOnly: true
      volumes:
      - name: models
        hostPath:
          path: /srv/glm-5.3-flash/q2
          type: Directory
      - name: store
        hostPath:
          path: /srv/glm-5.3-flash/store
          type: Directory
      - name: snapshot
        hostPath:
          path: /srv/glm-5.3-flash/snapshot-canary
          type: DirectoryOrCreate
      - name: client-classes
        secret:
          secretName: glm53-client-classes
          items:
          - key: classes.txt
            path: classes.txt
          defaultMode: 256
